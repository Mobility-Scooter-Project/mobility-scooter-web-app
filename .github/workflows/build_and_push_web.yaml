name: Create and publish a mswa-web image

on:
  push:
    branches:
      - develop
      - main
    paths:
      - apps/web/**
  pull_request:
    paths:
      - apps/web/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: web

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          # logic:
          # 1. keep standard branch name (mutable, e.g., :develop) for "latest of this branch"
          # 2. create immutable branch tag (e.g., :develop-20231130-120000)
          tags: |
            type=ref,event=branch
            type=ref,event=branch,suffix=-${{ steps.date.outputs.ts }}
            type=raw, value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=tag,prefix=v
            type=semver,pattern={{version}}
            type=sha
            ${{ github.ref_name == 'main' && 'latest' || '' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          target: web
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=https://cis240470.projects.jetstream-cloud.org
            VITE_API_KEY=your-api-key

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
