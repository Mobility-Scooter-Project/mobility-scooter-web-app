apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mswa-worker
  namespace: argocd
spec:
  destination:
    namespace: mswa
    server: 'https://kubernetes.default.svc'
  project: default
  sources:
    - repoURL: 'https://github.com/Mobility-Scooter-Project/mobility-scooter-infra.git'
      targetRevision: bryan/devpod
      path: charts/worker
      helm:
        values: |
          name: mswa-worker
          replicas: 1
          image:
            repository: ghcr.io/mobility-scooter-project/mobility-scooter-web-app/worker
            tag: develop
            pullPolicy: IfNotPresent

          gpu:
            enabled: true

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          
          database:
            enabled: true
            connectionStringEnvVarName: DATABASE_URL
            name: mswa-prod

          queue:
            enabled: true
            connectionStringEnvVarName: BROKER_URL

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true