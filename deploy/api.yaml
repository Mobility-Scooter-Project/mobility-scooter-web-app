apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mswa-api
  namespace: argocd
spec:
  destination:
    namespace: mswa
    server: 'https://kubernetes.default.svc'
  project: default
  sources:
    - repoURL: 'https://github.com/Mobility-Scooter-Project/mobility-scooter-infra.git'
      targetRevision: bryan/devpod
      path: charts/api
      helm:
        values: |
          name: mswa-api
          replicas: 1
          image:
            repository: myrepository
            tag: latest
            pullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          ingress:
            enabled: true
            subdomain: mswa.api

          database:
            enabled: true
            name: mswa-prod
            shouldCreate: true
            connectionStringEnvVarName: DATABASE_URL
            shouldMigrate: true
            migrationCommand: "npm run db:migrate"
            migrationWorkingDir: /usr/src/apps/api

          kv:
            enabled: true
            connectionStringEnvVarName: KV_URL

          queue:
            enabled: false
            connectionStringEnvVarName: BROKER_URL

          service:
            port: 3000
            targetPort: 3000
            project: default
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true